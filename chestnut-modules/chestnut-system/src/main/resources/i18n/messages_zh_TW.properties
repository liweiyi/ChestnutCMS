API.DOC.SYS.USER.CHANGE_DEPT=調動用戶所屬機構。需要用戶編輯權限（system:user:edit）；一般管理員須同時可管理用戶原機構和目標機構，超級管理員不受機構範圍限制。機構變更時，在同一交易中更新機構並解除該用戶的全部角色關聯，提交後更新已登入工作階段的機構和權限；用戶直接權限保留。目標機構與目前機構相同時不執行修改。成功回傳 R<Void>，無業務資料。
API.DOC.SYS.USER.CHANGE_DEPT_REQ=用戶機構調動請求參數。userId 和 deptId 均為必填的有效正整數 ID；deptId 必須指向真實機構。操作人由伺服器登入情境注入。呼叫端應先提示角色關聯將被解除，並在用戶確認後提交；目前請求不包含影響數量或確認標記。
API.DOC.SYS.USER.CHANGE_DEPT.TARGET_DEPT_ID=目標機構ID（必填，正整數，必須為已存在且可管理的真實機構，不能傳0）
