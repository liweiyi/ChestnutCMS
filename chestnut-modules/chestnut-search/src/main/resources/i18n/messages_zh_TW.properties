#錯誤消息
ERRCODE.SEARCH.DICT_WORD_EXISTS=字典詞“{0}”已存在
ERRCODE.SEARCH.MODEL_NOT_EXISTS=索引模型“{0}”不存在
ERRCODE.SEARCH.UNSUPPORTED_SEARCH_TYPE=不支援的檢索類型：{0}
ERRCODE.SEARCH.ESConnectFail=ElasticSearch連接失敗，請檢查連接配置和ES服務是否有效。

# 字典數據
DICT.SearchDictWordType=自定義詞庫類型
