FREEMARKER.FUNC.imageSize.DESC=獲得圖片縮放圖函數，不在的縮略圖會自動建立，例如：`${imageSize(content.logo, 300, 300)}`
FREEMARKER.FUNC.imageSize.Arg1.Name=圖片資源內部路徑（iurl://）
