# freemarker模板函数
FREEMARKER.FUNC.htmlInternalUrl.DESC=将html文本中的内部链接地址“iurl://”解析为正常http(s)访问地址，例如：`${htmlInternalUrl(ArticleContent)}`
FREEMARKER.FUNC.htmlInternalUrl.Arg1.Name=Html文本內容
FREEMARKER.FUNC.imageSize.DESC=获得图片缩放图函数，不在的缩略图会自动创建，例如：`${imageSize(content.logo, 300, 300)}`
FREEMARKER.FUNC.imageSize.Arg1.Name=图片资源内部路径（iurl://）
FREEMARKER.FUNC.imageSize.Arg1.Desc=仅支持处理内部资源图片（iurl://）
FREEMARKER.FUNC.imageSize.Arg2.Name=宽度
FREEMARKER.FUNC.imageSize.Arg3.Name=高度
FREEMARKER.FUNC.internalUrl.DESC=将内部链接“iurl://”解析为正常http(s)访问地址，例如：`${internalUrl(content.redirectUrl)}`
FREEMARKER.FUNC.internalUrl.Arg1.Name=内部链接（iurl://）
FREEMARKER.FUNC.siteUrl.DESC=获取站点指定发布通道访问链接，例如：`${siteUrl(Site.siteId, 'h5')}`
FREEMARKER.FUNC.siteUrl.Arg1.Name=站点ID
FREEMARKER.FUNC.siteUrl.Arg2.Name=发布通道编码
FREEMARKER.FUNC.catalogUrl.DESC=获取栏目指定发布通道访问链接，例如：`${catalogUrl(Catalog.catalogId, 'h5')}`
FREEMARKER.FUNC.catalogUrl.Arg1.Name=栏目ID
FREEMARKER.FUNC.catalogUrl.Arg2.Name=发布通道编码
FREEMARKER.FUNC.contentUrl.DESC=获取内容指定发布通道访问链接，例如：`${contentUrl(Content.contentId, 'h5')}`
FREEMARKER.FUNC.contentUrl.Arg1.Name=内容ID
FREEMARKER.FUNC.contentUrl.Arg2.Name=发布通道编码
FREEMARKER.FUNC.dynamicPageLink.DESC=动态页面链接获取函数，例如：`${dynamicPageLink('Search')}`
FREEMARKER.FUNC.dynamicPageLink.Arg1.Name=动态页面类型
FREEMARKER.FUNC.dynamicPageLink.Arg2.Name=忽略`sid/pp`参数
FREEMARKER.FUNC.dict.DESC=获取字典数据列表，例如：`${dict('YesOrNo', 'Y')}`
FREEMARKER.FUNC.dict.Arg1.Name=字典类型
FREEMARKER.FUNC.dict.Arg2.Name=字典数据值
FREEMARKER.FUNC.dict.Arg3.Name=国际化标识
FREEMARKER.FUNC.sysConfig.DESC=获取系统参数配置值，例如：`${sysConfig('SiteApiUrl')}`
FREEMARKER.FUNC.sysConfig.Arg1.Name=系统参数键名
FREEMARKER.FUNC.listHtmlInternalUrl.DESC=获取html文本中的iurl列表，例如：`${listHtmlInternalUrl(ArticleContent)}`
FREEMARKER.FUNC.listHtmlInternalUrl.Arg1.Name=Html文本内容
FREEMARKER.FUNC.contentPageLink.DESC=获取内容分页链接，例如：`${contentPageLink(content.link, 2)}`
FREEMARKER.FUNC.contentPageLink.Arg1.Name=内容链接
FREEMARKER.FUNC.contentPageLink.Arg2.Name=页码
FREEMARKER.FUNC.videoPlayer.DESC=将html文本中的视频资源链接替换为`<video>`视频播放器
